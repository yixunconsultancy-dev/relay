<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080808; padding: 20px 24px; }
  .section { margin-bottom: 18px; }
  .section-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(198,163,79,0.5); margin-bottom: 8px; }
  .space-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .space-bar { height: 10px; background: #C6A34F; border-radius: 2px; opacity: 0.7; }
  .space-name { font-family: 'Barlow', sans-serif; font-size: 10px; color: rgba(250,247,244,0.5); min-width: 40px; }
  .space-val { font-family: monospace; font-size: 9px; color: rgba(250,247,244,0.3); }
  .radius-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .radius-box { width: 48px; height: 36px; background: rgba(198,163,79,0.2); border: 1px solid rgba(198,163,79,0.5); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }
  .radius-label { font-family: monospace; font-size: 9px; color: rgba(250,247,244,0.4); }
</style>
</head>
<body>
  <div class="section">
    <div class="section-label">Spacing Scale</div>
    <div class="space-row"><div class="space-name">space-1</div><div class="space-bar" style="width:4px;"></div><div class="space-val">4px</div></div>
    <div class="space-row"><div class="space-name">space-2</div><div class="space-bar" style="width:8px;"></div><div class="space-val">8px</div></div>
    <div class="space-row"><div class="space-name">space-3</div><div class="space-bar" style="width:12px;"></div><div class="space-val">12px</div></div>
    <div class="space-row"><div class="space-name">space-4</div><div class="space-bar" style="width:16px;"></div><div class="space-val">16px</div></div>
    <div class="space-row"><div class="space-name">space-6</div><div class="space-bar" style="width:24px;"></div><div class="space-val">24px</div></div>
    <div class="space-row"><div class="space-name">space-8</div><div class="space-bar" style="width:32px;"></div><div class="space-val">32px</div></div>
    <div class="space-row"><div class="space-name">space-12</div><div class="space-bar" style="width:48px;"></div><div class="space-val">48px</div></div>
    <div class="space-row"><div class="space-name">space-16</div><div class="space-bar" style="width:64px;"></div><div class="space-val">64px</div></div>
  </div>
  <div class="section">
    <div class="section-label">Border Radius</div>
    <div class="radius-row">
      <div><div class="radius-box" style="border-radius:0px;"></div><div class="radius-label" style="text-align:center;margin-top:3px;">none</div></div>
      <div><div class="radius-box" style="border-radius:2px;"></div><div class="radius-label" style="text-align:center;margin-top:3px;">sm 2px</div></div>
      <div><div class="radius-box" style="border-radius:4px;"></div><div class="radius-label" style="text-align:center;margin-top:3px;">md 4px</div></div>
      <div><div class="radius-box" style="border-radius:6px;"></div><div class="radius-label" style="text-align:center;margin-top:3px;">lg 6px</div></div>
      <div><div class="radius-box" style="border-radius:8px;"></div><div class="radius-label" style="text-align:center;margin-top:3px;">xl 8px</div></div>
    </div>
  </div>
</body>
</html>
