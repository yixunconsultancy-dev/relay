<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; padding: 28px 24px; }
  .hero { font-family: 'Cormorant Garamond', serif; font-size: 64px; font-weight: 300; line-height: 1.05; letter-spacing: -0.02em; color: #E8E8E8; margin-bottom: 12px; }
  .hero em { color: #C6A34F; font-style: italic; }
  .sub { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #C6A34F; margin-bottom: 20px; }
  .h2 { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; color: #E8E8E8; margin-bottom: 8px; }
  .h3 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; color: rgba(232,232,232,0.65); }
  hr { border: none; border-top: 1px solid #2A2A2A; margin: 14px 0; }
</style>
</head>
<body>
  <div class="sub">Display — Cormorant Garamond Light</div>
  <div class="hero">Ascendance<br><em>Wealth</em></div>
  <hr>
  <div class="h2">Power Law Dynamics</div>
  <hr>
  <div class="h3">The top 6% produce 60% of returns</div>
</body>
</html>
