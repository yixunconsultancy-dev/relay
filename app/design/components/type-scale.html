<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Barlow:wght@300;400;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; padding: 20px 24px; }
  .scale-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .size-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(198,163,79,0.5); min-width: 48px; }
  .size-px { font-family: monospace; font-size: 9px; color: rgba(255,255,255,0.18); min-width: 28px; }
  .specimen { font-family: 'Cormorant Garamond', serif; font-weight: 300; color: #E8E8E8; line-height: 1; }
</style>
</head>
<body>
  <div class="scale-row"><div class="size-label">display</div><div class="size-px">96px</div><div class="specimen" style="font-size:48px;">Ascendance</div></div>
  <div class="scale-row"><div class="size-label">5xl</div><div class="size-px">72px</div><div class="specimen" style="font-size:36px;">Wealth</div></div>
  <div class="scale-row"><div class="size-label">4xl</div><div class="size-px">56px</div><div class="specimen" style="font-size:28px;">Power Law</div></div>
  <div class="scale-row"><div class="size-label">3xl</div><div class="size-px">40px</div><div class="specimen" style="font-size:20px;">Distribution Dynamics</div></div>
  <div class="scale-row"><div class="size-label">2xl</div><div class="size-px">32px</div><div class="specimen" style="font-size:16px;">Network Effects in Finance</div></div>
  <div class="scale-row"><div class="size-label">xl</div><div class="size-px">24px</div><div class="specimen" style="font-family:'Barlow',sans-serif;font-size:14px;font-weight:400;">IUL Policy Benefits & Structure</div></div>
  <div class="scale-row"><div class="size-label">base</div><div class="size-px">16px</div><div class="specimen" style="font-family:'Barlow',sans-serif;font-size:12px;font-weight:400;color:rgba(250,247,244,0.7);">Body copy and explanatory content runs here</div></div>
  <div class="scale-row"><div class="size-label">sm</div><div class="size-px">14px</div><div class="specimen" style="font-family:'Barlow',sans-serif;font-size:11px;font-weight:300;color:rgba(250,247,244,0.45);font-style:italic;">Source attribution and footnote captions</div></div>
</body>
</html>
