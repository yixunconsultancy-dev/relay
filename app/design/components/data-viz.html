<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600&family=Barlow+Condensed:wght@700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; padding: 18px 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel { background: #0E0E0E; border: 1px solid #1A1A1A; border-radius: 2px; padding: 14px; }
  .panel-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(198,163,79,0.5); margin-bottom: 10px; }
  /* Power Law Curve */
  svg { width: 100%; height: 80px; }
  /* Bar chart */
  .bars { display: flex; gap: 5px; align-items: flex-end; height: 70px; }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .bar { width: 100%; border-radius: 2px 2px 0 0; }
  .bar-lbl { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: rgba(250,247,244,0.35); }
  /* Distribution line */
  .dist-label { font-family: 'Barlow', sans-serif; font-size: 10px; color: rgba(250,247,244,0.4); text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div class="grid">
  <!-- Power Law Curve -->
  <div class="panel">
    <div class="panel-label">Power Law Distribution</div>
    <svg viewBox="0 0 200 80" preserveAspectRatio="none">
      <defs>
        <linearGradient id="plGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C6A34F" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#C6A34F" stop-opacity="0.05"/>
        </linearGradient>
      </defs>
      <path d="M 0 2 Q 20 2 40 20 Q 80 55 200 74" stroke="#C6A34F" stroke-width="1.5" fill="none"/>
      <path d="M 0 2 Q 20 2 40 20 Q 80 55 200 74 L 200 78 L 0 78 Z" fill="url(#plGrad)"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="rgba(198,163,79,0.2)" stroke-width="0.5" stroke-dasharray="3,3"/>
      <text x="2" y="14" font-family="JetBrains Mono, monospace" font-size="7" fill="rgba(250,247,244,0.4)">6%</text>
      <text x="42" y="14" font-family="JetBrains Mono, monospace" font-size="7" fill="rgba(250,247,244,0.3)">→ 60% of returns</text>
    </svg>
    <div class="dist-label">Top earners · exponential advantage</div>
  </div>
  <!-- Returns Bar Chart -->
  <div class="panel">
    <div class="panel-label">Returns by Tier</div>
    <div class="bars">
      <div class="bar-wrap">
        <div class="bar" style="height:72px; background:#C6A34F;"></div>
        <div class="bar-lbl">Top 6%</div>
      </div>
      <div class="bar-wrap">
        <div class="bar" style="height:24px; background:#815D46;"></div>
        <div class="bar-lbl">Next 14%</div>
      </div>
      <div class="bar-wrap">
        <div class="bar" style="height:10px; background:rgba(198,163,79,0.25);"></div>
        <div class="bar-lbl">Mid 30%</div>
      </div>
      <div class="bar-wrap">
        <div class="bar" style="height:4px; background:rgba(198,163,79,0.12);"></div>
        <div class="bar-lbl">Bottom 50%</div>
      </div>
    </div>
  </div>
  <!-- Network Graph (SVG constellation) -->
  <div class="panel">
    <div class="panel-label">Network Graph</div>
    <svg viewBox="0 0 200 75">
      <line x1="100" y1="37" x2="60" y2="15" stroke="rgba(198,163,79,0.3)" stroke-width="0.8"/>
      <line x1="100" y1="37" x2="140" y2="20" stroke="rgba(198,163,79,0.3)" stroke-width="0.8"/>
      <line x1="100" y1="37" x2="155" y2="55" stroke="rgba(198,163,79,0.3)" stroke-width="0.8"/>
      <line x1="100" y1="37" x2="70" y2="60" stroke="rgba(198,163,79,0.3)" stroke-width="0.8"/>
      <line x1="100" y1="37" x2="40" y2="45" stroke="rgba(198,163,79,0.3)" stroke-width="0.8"/>
      <line x1="60" y1="15" x2="30" y2="10" stroke="rgba(198,163,79,0.15)" stroke-width="0.6"/>
      <line x1="140" y1="20" x2="170" y2="10" stroke="rgba(198,163,79,0.15)" stroke-width="0.6"/>
      <line x1="60" y1="15" x2="40" y2="45" stroke="rgba(198,163,79,0.15)" stroke-width="0.6"/>
      <circle cx="100" cy="37" r="5" fill="#C6A34F" opacity="0.95"/>
      <circle cx="60" cy="15" r="3" fill="#C6A34F" opacity="0.7"/>
      <circle cx="140" cy="20" r="3" fill="#C6A34F" opacity="0.7"/>
      <circle cx="155" cy="55" r="2.5" fill="#C6A34F" opacity="0.55"/>
      <circle cx="70" cy="60" r="2.5" fill="#C6A34F" opacity="0.55"/>
      <circle cx="40" cy="45" r="2" fill="#C6A34F" opacity="0.4"/>
      <circle cx="30" cy="10" r="1.5" fill="#C6A34F" opacity="0.3"/>
      <circle cx="170" cy="10" r="1.5" fill="#C6A34F" opacity="0.3"/>
    </svg>
    <div class="dist-label">Hub-and-spoke · preferential attachment</div>
  </div>
  <!-- Growth Curve -->
  <div class="panel">
    <div class="panel-label">Compound Growth</div>
    <svg viewBox="0 0 200 75">
      <defs>
        <linearGradient id="cgGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C6A34F" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#C6A34F" stop-opacity="0.03"/>
        </linearGradient>
      </defs>
      <path d="M 10 68 Q 60 66 90 55 Q 130 38 190 8" stroke="#C6A34F" stroke-width="1.5" fill="none"/>
      <path d="M 10 68 Q 60 66 90 55 Q 130 38 190 8 L 190 72 L 10 72 Z" fill="url(#cgGrad)"/>
      <text x="145" y="14" font-family="JetBrains Mono, monospace" font-size="7" fill="rgba(198,163,79,0.75)">14.7%</text>
      <text x="145" y="23" font-family="Barlow, sans-serif" font-size="7" fill="rgba(250,247,244,0.3)">IRR</text>
    </svg>
    <div class="dist-label">IUL policy cash value growth</div>
  </div>
</div>
</body>
</html>
